<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 背景圆角矩形 - 内缩到约 76%，四周留充足透明边距（与 easy-ops 图标对齐） -->
  <rect x="30" y="30" width="196" height="196" rx="40" fill="#1E1E2E"/>
  <!-- Env 文字：字体栈与 easy-ops 一致（系统无衬线，非等宽代码字体），字重 800、收紧字距 -->
  <text x="128" y="160" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-2" text-anchor="middle" fill="#FFFFFF">Env</text>
</svg>
